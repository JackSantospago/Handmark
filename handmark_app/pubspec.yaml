name: handmark
description: "Handmark: a curated marketplace for verified handmade objects (clickable UI demo)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4   # app_settings.dart (on the web it quietly stays in memory)

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Bundled so the demo looks the same everywhere (SIL Open Font License, see assets/fonts/).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-500.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
